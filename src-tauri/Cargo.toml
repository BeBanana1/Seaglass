[package]
name = "seaglass"
version = "0.5.96"
description = "Seaglass, client de streaming non officiel"
authors = ["Seaglass contributors"]
edition = "2024"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre lib et bin sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "seaglass_lib"
# `cdylib` pour Android, `rlib` pour le binaire du bureau. Pas de `staticlib` (iOS seulement) :
# chaque type de bibliothèque refait l'optimisation à l'édition de liens en release.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
# Jam en ligne (#25) : connexion sortante au relais, certificats vérifiés par le magasin du
# système comme `reqwest` (rustls et futures-util sont déjà compilés par reqwest et tauri).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Transfert et historique par le relais (#430), chiffrés de bout en bout (ChaCha20-Poly1305) :
# la crate du fournisseur de rustls ci-dessus, déjà compilée, mêmes fonctionnalités.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# QR code de la Jam (#25), rendu en SVG : sans la génération d'images par défaut.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Bureau seulement : zone de notification, démarrage auto, instance unique, mises à jour.
# Android (#24) n'a ni l'un ni l'autre ; les fonctionnalités de `tauri` s'additionnent.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Android : vérification HTTPS par le magasin de certificats du système (#24), initialisée au
# démarrage avec la JVM et le contexte posés par tao. Déjà tirées par reqwest et tauri.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
# Pont natif (Kotlin) : connexion TIDAL dans sa propre WebView, puis Media3.
tauri-plugin-seaglass-mobile = { path = "plugins/seaglass-mobile" }

# Linux (#17) : jetons dans le Secret Service (GNOME Keyring, KWallet). Sans backend,
# `keyring` n'a qu'un magasin en mémoire et la session est perdue à la fermeture.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Contrôles média (MPRIS, #312). Mêmes version et features que celles tirées par
# tauri-plugin-opener et tauri-plugin-single-instance : aucune crate de plus à compiler.
zbus = "5"

[target.'cfg(windows)'.dependencies]
# Même version que celle tirée par Tauri : aucune compilation supplémentaire.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Media",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# ThinLTO sur les 16 unités par défaut : parallèle, là où une LTO complète sur une seule unité
# tournait sur un cœur. Différence de performance invisible pour l'app (réseau et mpv).
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
