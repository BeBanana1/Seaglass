[package]
name = "seaglass"
version = "0.4.37"
description = "Seaglass, client de streaming non officiel"
authors = ["bebanana"]
edition = "2024"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre lib et bin sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "seaglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Même version que celle tirée par Tauri : aucune compilation supplémentaire.
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
