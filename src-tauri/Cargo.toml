[package]
name = "seaglass"
version = "0.5.119"
description = "Seaglass, client de streaming non officiel"
authors = ["Seaglass contributors"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between lib and bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "seaglass_lib"
# `cdylib` for Android, `rlib` for the desktop binary. No `staticlib` (iOS only): each library
# type redoes link-time optimization in release.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
# Online Jam (#25): outgoing connection to the relay, certificates checked by the system store
# like `reqwest` (rustls and futures-util are already compiled by reqwest and tauri).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Handoff and history through the relay (#430), end-to-end encrypted (ChaCha20-Poly1305): the
# crate of the rustls provider above, already compiled, same features.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# Jam QR code (#25), rendered as SVG: without the default image generation.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Desktop only: notification area, launch at startup, single instance, updates. Android (#24)
# has none of them; the features of `tauri` add up.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Android: HTTPS checked by the system certificate store (#24), initialized at startup with the
# JVM and context set by tao. Already pulled in by reqwest and tauri.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
# Native bridge (Kotlin): TIDAL sign-in in its own WebView, then Media3.
tauri-plugin-seaglass-mobile = { path = "plugins/seaglass-mobile" }

# Linux (#17): tokens in the Secret Service (GNOME Keyring, KWallet). Without a backend,
# `keyring` only has an in-memory store and the session is lost on exit.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Media controls (MPRIS, #312). Same version and features as those pulled in by
# tauri-plugin-opener and tauri-plugin-single-instance: no extra crate to compile.
zbus = "5"

[target.'cfg(windows)'.dependencies]
# Same version as the one pulled in by Tauri: nothing extra to compile.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Media",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# TypeScript types for the UI generated from the Rust ones (#44), in tests only: nothing
# reaches the app. `cargo test` writes them to `src/lib/bindings/`.
[dev-dependencies]
# `no-serde-warnings`: serde attributes it does not need (`transparent`, `from`) stay silent.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

# ThinLTO over the default 16 units: parallel, where a full LTO on a single unit ran on one
# core. No visible performance difference for the app (network and mpv).
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
