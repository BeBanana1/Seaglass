<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <title>Seaglass Jam</title>
    <link rel="stylesheet" href="jam.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Seaglass <span>Jam</span></h1>
        <p class="lead" data-t="lead"></p>
      </header>

      <section id="join" hidden>
        <form id="join-form" autocomplete="off">
          <label for="name" data-t="nameLabel"></label>
          <input id="name" maxlength="24" autocomplete="nickname" enterkeyhint="next" />
          <label for="code" data-t="codeLabel"></label>
          <input id="code" maxlength="9" autocapitalize="characters" spellcheck="false" enterkeyhint="go" />
          <button type="submit" data-t="join"></button>
          <p id="join-error" class="error" role="alert" hidden></p>
        </form>
      </section>

      <section id="jam" hidden>
        <!-- Chercher dans son app, puis revenir coller le lien (#225, #229). Texte seulement. -->
        <nav class="apps" aria-labelledby="apps-label">
          <span id="apps-label" data-t="appsLabel"></span>
          <a href="https://listen.tidal.com/" target="_blank" rel="noopener noreferrer">TIDAL</a>
          <a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">Spotify</a>
          <a href="https://music.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube Music</a>
          <a href="https://www.deezer.com/" target="_blank" rel="noopener noreferrer">Deezer</a>
          <a href="https://music.apple.com/" target="_blank" rel="noopener noreferrer">Apple Music</a>
        </nav>
        <div id="now" class="now" aria-live="polite"></div>

        <form id="search-form" class="search" role="search" autocomplete="off">
          <input id="query" type="search" maxlength="300" enterkeyhint="search" />
          <button id="clear" type="button" class="clear" hidden>✕</button>
        </form>
        <p class="hint" data-t="pasteHint"></p>
        <p id="search-status" class="muted status" aria-live="polite" hidden></p>
        <div id="tabs" class="tabs" role="tablist" hidden>
          <button id="tab-tracks" type="button" role="tab" class="tab"></button>
          <button id="tab-albums" type="button" role="tab" class="tab"></button>
        </div>
        <ul id="results" class="tracks"></ul>

        <h2 data-t="upNext"></h2>
        <ul id="queue" class="tracks"></ul>
        <p id="queue-empty" class="muted" data-t="queueEmpty" hidden></p>

        <p class="who">
          <span id="who"></span>
          <button id="rename" type="button" class="link" data-t="rename"></button>
        </p>
      </section>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="jam.js"></script>
  </body>
</html>
