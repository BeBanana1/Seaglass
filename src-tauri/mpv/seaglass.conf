# Configuration mpv dédiée à Seaglass.
# Chargée avec --no-config --include=<ce fichier> : la config mpv personnelle n'est jamais lue.
# Les options de lancement (idle, ao, IPC, gapless) sont passées par mpv/process.rs.

# Aucun flux audio sur disque (principe 1) : cache en mémoire uniquement.
# Sa taille (demuxer-max-bytes, demuxer-max-back-bytes) est un réglage de lecture,
# passé au lancement par mpv/process.rs et modifiable à chaud (mpv/cache.rs).
cache=yes
cache-on-disk=no

# Pas de résolution d'URL par youtube-dl, pas de scripts utilisateur.
ytdl=no
load-scripts=no
osc=no

# Seaglass publie sa propre session SMTC (integrations/smtc.rs) : mpv ne doit pas
# en créer une seconde ni capter les touches média, qui passent par le lecteur.
media-controls=no
input-media-keys=no

# Chaîne audio neutre : volume 100, pas de normalisation ni de filtre.
volume=100
volume-max=100
replaygain=no
audio-display=no
