# mpv configuration dedicated to Seaglass.
# Loaded with --no-config --include=<this file>: the personal mpv config is never read.
# The launch options (idle, ao, IPC, gapless) are passed by mpv/process.rs.

# No audio stream on disk (principle 1): in-memory cache only.
# Its size (demuxer-max-bytes, demuxer-max-back-bytes) is a playback setting,
# passed at launch by mpv/process.rs and changeable on the fly (mpv/cache.rs).
cache=yes
cache-on-disk=no

# No URL resolution by youtube-dl, no user scripts.
ytdl=no
load-scripts=no
osc=no

# Seaglass publishes its own SMTC session (integrations/smtc.rs): mpv must not
# create a second one nor grab the media keys, which go through the player.
media-controls=no
input-media-keys=no

# Neutral audio chain: volume 100, no normalization or filter.
volume=100
volume-max=100
replaygain=no
audio-display=no

# Exclusive mode (#308): 50 ms WASAPI buffer instead of the device's default period
# (10 ms). Some USB interfaces (Focusrite) only wake mpv up every ~22 ms: with
# 10 ms, underrun on every cycle (crackling, repeated bits). No effect in shared mode.
wasapi-exclusive-buffer=50000
