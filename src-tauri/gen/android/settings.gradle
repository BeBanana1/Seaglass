include ':app'

apply from: 'tauri.settings.gradle'

// The app's Kotlin plugin is always the one from this repository. `tauri.settings.gradle`
// (generated) reuses the path output by the plugin's build script, which Cargo keeps cached:
// after a build from a worktree, it pointed to that worktree's Kotlin, and APK 0.5.25 shipped
// without the widget or the pin shortcuts.
project(':tauri-plugin-seaglass-mobile').projectDir =
    new File(rootDir, '../../plugins/seaglass-mobile/android').canonicalFile
