include ':app'

apply from: 'tauri.settings.gradle'

// Le plugin Kotlin de l'app est toujours celui de ce dépôt. `tauri.settings.gradle` (généré)
// reprend le chemin sorti par le script de build du plugin, que Cargo garde en cache : après
// une compilation depuis un worktree, il pointait vers le Kotlin de ce worktree, et l'APK
// 0.5.25 est sorti sans le widget ni les raccourcis d'épingles.
project(':tauri-plugin-seaglass-mobile').projectDir =
    new File(rootDir, '../../plugins/seaglass-mobile/android').canonicalFile
