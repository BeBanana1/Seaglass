# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# Keeping Gradle 9 compatible with current plugins
# TODO: Remove this in v3
android.builtInKotlin=false
android.newDsl=false

# Known warnings, specific to the Tauri template (the three options above) and to the Gradle
# Kotlin plugin, which still calls the `applicationVariants` API (hence `newDsl=false`).
# The `tauri-android` module of the tauri crate still compiles as Java 8; ours and the
# `seaglass-mobile` plugin use Java 17. To remove with Tauri v3.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,JAVA_COMPILE_DEPRECATED_SOURCE_TARGET
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# The Kotlin sources of tauri and its plugins are in the cargo registry (C:), the project
# on G:: Kotlin's incremental compilation cannot relativize paths between two drives, the
# daemon crashes ("this and base files have different roots") then recompiles without it,
# with a huge stack trace in the build (#443). These modules are small: compiling them
# in full every time costs less than the daemon failure.
kotlin.incremental=false
