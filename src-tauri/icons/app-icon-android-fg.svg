<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Premier plan de l'icône adaptative d'Android : app-icon.svg réduit pour tenir
       dans la zone sûre (cercle de 66 dp sur 108). -->
  <g transform="translate(512 512) scale(0.68) translate(-512 -512)">
  <defs>
    <clipPath id="sky"><path d="M300 300 H724 V488 C 660 568 580 572 512 516 S 380 456 300 540 Z" /></clipPath>
  </defs>
  <circle cx="512" cy="512" r="420" fill="#111417" />
  <!-- Sillons. -->
  <g fill="none" stroke="#ffffff" stroke-width="7" opacity="0.12">
    <circle cx="512" cy="512" r="200" />
    <circle cx="512" cy="512" r="234" />
    <circle cx="512" cy="512" r="268" />
    <circle cx="512" cy="512" r="302" />
    <circle cx="512" cy="512" r="336" />
    <circle cx="512" cy="512" r="370" />
  </g>
  <!-- Étiquette : la mer, puis le soleil au-dessus de la vague. -->
  <circle cx="512" cy="512" r="168" fill="#13a89e" />
  <circle cx="512" cy="512" r="168" fill="#ffb547" clip-path="url(#sky)" />
  <circle cx="512" cy="512" r="22" fill="#111417" />
  </g>
</svg>
