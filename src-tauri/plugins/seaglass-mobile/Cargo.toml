[package]
name = "tauri-plugin-seaglass-mobile"
version = "0.1.0"
description = "Pont natif Android de Seaglass (#24) : connexion TIDAL, puis lecture Media3"
edition = "2024"
license = "GPL-3.0-only"
publish = false
links = "tauri-plugin-seaglass-mobile"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2"

# Appels JNI directs (`src/direct.rs`, #169), mêmes versions que l'app.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
serde_json = "1.0.154"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
