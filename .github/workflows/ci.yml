# Checks on every push to main and every PR: the same as the "Commands" section of
# CLAUDE.md. GitHub-hosted runners (free for a public repository). No release here:
# the signing keys stay on the maintainer's PC (docs/release.md, "No release in CI").
name: CI

# No `paths-ignore`: `linux` and `windows` are required checks on `main`, and a PR whose
# required checks never start could never be merged. The `changes` job decides instead which
# jobs run (#24); a job skipped by its `if:` reports success.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly full run: catches a new advisory (dependency audit) even when no app PR runs it.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# A PR's code must not be able to write to the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run still going on the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: useless for clippy and the tests, it slows linking and grows the cache.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PNPM_VERSION: "12.16.1"

jobs:
  # Which parts the change touches (scripts/ci-changes.sh). Outside a PR, everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      site: ${{ steps.paths.outputs.site }}
      relay: ${{ steps.paths.outputs.relay }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        run: bash scripts/ci-changes.sh "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    # Also runs if `changes` failed: an error must never skip a required check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history and tags: the version check compares with the last `v*` tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # First: a few seconds, and the most frequent oversight before a release.
      - name: Version
        run: bash scripts/check-version.sh

      - name: System libraries (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm check
          pnpm test
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Keep the cache even when clippy or a test fails: the next run stays fast.
          cache-on-failure: true

      # `pnpm build` first: `tauri::generate_context!` requires `dist/` to exist.
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Known vulnerabilities in the dependencies (#263). Fails on a vulnerability; a crate
      # only flagged unmaintained or yanked stays a warning. An outage of the npm registry
      # stays a warning. To ignore an advisory: `--ignore RUSTSEC-…` below, with its reason.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Dependencies
        run: |
          pnpm audit --prod --ignore-registry-errors
          cargo audit --file src-tauri/Cargo.lock

  # The `#[cfg(windows)]` code (SMTC, Job Object, WASAPI) is not compiled on Linux.
  windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 45
    # bash stops at the first failing command; pwsh would only report the last one.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Only to produce `dist/` for `generate_context!`: the frontend checks run on Linux.
      - name: Frontend build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Rust
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Website (#18): its own package, outside the app. The build fails if inline code that
  # the server's CSP would block is left in a page (site/scripts/no-inline.mjs).
  site:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Build
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  # Jam relay (#25): separate crate, deployed on the server (relay/README.md).
  relay:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relay == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
          cache-on-failure: true
      - name: Rust
        working-directory: relay
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Dependencies
        run: cargo audit --file relay/Cargo.lock
