# Vérifications à chaque push sur main et sur chaque PR : les mêmes que la section
# « Commandes » de CLAUDE.md. Runner dédié (ci/README.md), image `seaglass-ci` avec
# Node, pnpm, Rust et les bibliothèques de Tauri déjà installés.
# Sous Linux, le code `#[cfg(windows)]` (SMTC, Job Object) n'est pas compilé :
# `pnpm release` le vérifie sous Windows. Aucune release ici : la clé de signature
# reste sur le PC.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

jobs:
  check:
    runs-on: seaglass
    # Un run normal dure 2 à 5 min : au-delà, il est bloqué (vu le 2026-11-03, compilation
    # des tests figée plus de 10 min) et ne doit pas occuper le runner indéfiniment.
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # Pas d'infos de débogage : inutiles pour clippy et les tests, elles alourdissent
      # l'édition de liens (mémoire du serveur) et le cache (~1,9 Go à restaurer à chaque run).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # Historique complet et tags : le contrôle de version compare au dernier tag `v*`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # En premier : quelques secondes, et l'oubli le plus fréquent avant une release.
      - name: Version
        run: bash scripts/check-version.sh

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      # Rust est dans l'image : l'action ne télécharge qu'une nouvelle stable.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            relay
          # Garde le cache même si clippy ou un test échoue : le run suivant reste rapide.
          cache-on-failure: true

      # `pnpm build` d'abord : `tauri::generate_context!` exige que `dist/` existe.
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Relais de la Jam (#25) : crate séparée, déployée sur le serveur (relay/README.md).
      - name: Relais
        working-directory: relay
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Vulnérabilités connues des dépendances (#263). Échoue sur une vulnérabilité ; une
      # crate seulement signalée non maintenue ou retirée reste un avertissement. Une panne
      # du registre npm, de crates.io ou de la base RustSec n'échoue pas : elle avertit.
      # `cargo-audit` est dans l'image ; une image plus ancienne l'installe ici (gardé par
      # le cache Rust). Une alerte à ignorer : `--ignore RUSTSEC-…` ci-dessous, avec sa raison.
      - name: Dépendances
        run: |
          pnpm audit --prod --ignore-registry-errors
          if ! command -v cargo-audit >/dev/null && ! cargo install cargo-audit --locked; then
            echo "::warning::cargo-audit non installé : dépendances Rust non vérifiées"
            exit 0
          fi
          db="$(mktemp -d)/advisory-db"
          if ! git clone --quiet --depth 1 https://github.com/RustSec/advisory-db.git "$db"; then
            echo "::warning::base d'avis RustSec injoignable : dépendances Rust non vérifiées"
            exit 0
          fi
          cargo audit --no-fetch --db "$db" --file src-tauri/Cargo.lock
          cargo audit --no-fetch --db "$db" --file relay/Cargo.lock
