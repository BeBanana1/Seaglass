# Jam relay (#25), on the server, behind the existing Caddy (see README.md).
# Caddy runs in `network_mode: host`: it reaches the relay through 127.0.0.1. The port is
# only published on the loopback, so nobody bypasses Caddy (the relay trusts
# `X-Forwarded-For`).
name: seaglass-relay

services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: seaglass-relay:latest
    restart: unless-stopped
    environment:
      SEAGLASS_RELAY_KEY: ${SEAGLASS_RELAY_KEY:?must be set in .env (see .env.example)}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:?must be set in .env (see .env.example)}
    ports:
      - "127.0.0.1:${RELAY_PORT:-47880}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
