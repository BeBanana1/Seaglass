# Relais de la Jam (#25), sur le serveur, derrière le Caddy existant (voir README.md).
name: seaglass-relay

services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: seaglass-relay:latest
    restart: unless-stopped
    environment:
      SEAGLASS_RELAY_KEY: ${SEAGLASS_RELAY_KEY:?à définir dans .env (voir .env.example)}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-https://jam.bebanana.ch}
    # Aucun port publié : seul Caddy le joint, par son réseau.
    networks:
      caddy:
        aliases: [seaglass-relay]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:?nom du réseau Docker de Caddy, dans .env}
