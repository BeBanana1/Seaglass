# Configuration d'act_runner pour le runner dédié à Seaglass.
# Seules les clés utiles sont posées, les autres gardent leur valeur par défaut
# (`act_runner generate-config` affiche le fichier complet).

log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 1h
  # Le tag de l'image doit être celui de SEAGLASS_CI_TAG dans .env.
  labels:
    - "seaglass:docker://seaglass-ci:2026-10"

cache:
  enabled: true
  # Dans le volume : le cache Rust survit à une recréation du conteneur.
  dir: /data/cache
  # Hôte détecté automatiquement (adresse du runner sur le réseau seaglass-ci),
  # port fixe pour qu'il reste joignable depuis les jobs.
  host: ""
  port: 8088

container:
  # Les jobs rejoignent le réseau du runner au lieu d'un réseau créé par job :
  # c'est ce qui rend le serveur de cache joignable (ETIMEDOUT sinon).
  network: seaglass-ci
  privileged: false
  # L'image est construite localement : ne jamais essayer de la télécharger.
  force_pull: false
  # Un job ne peut pas prendre toute la RAM de la VM (gel du serveur le 2026-11-17,
  # rustc sans limite et sans swap) : au-delà de 4 Go (+1 Go de swap), il est tué dans
  # son conteneur. Si le noyau doit tuer quelque chose, il choisit le job plutôt que
  # Gitea ou les autres services.
  options: --memory=4g --memory-swap=5g --oom-score-adj=500
