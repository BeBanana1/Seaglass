# Runner Gitea Actions dédié à Seaglass, sur le serveur (voir ci/README.md).
name: seaglass-runner

services:
  runner:
    image: docker.io/gitea/act_runner:0.6.1 # même version que le runner partagé
    restart: unless-stopped
    environment:
      CONFIG_FILE: /config.yaml
      # Même adresse que le runner partagé : Gitea sur l'hôte, joignable aussi
      # depuis les conteneurs des jobs (checkout).
      GITEA_INSTANCE_URL: http://172.17.0.1:3002
      GITEA_RUNNER_REGISTRATION_TOKEN: ${SEAGLASS_RUNNER_TOKEN}
      GITEA_RUNNER_NAME: seaglass
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./data:/data
      # Le runner lance les jobs dans des conteneurs frères : il équivaut à root
      # sur le serveur. Enregistré au niveau du dépôt Seaglass uniquement.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ci]

  # Image des jobs, construite à la demande : docker compose --profile build build
  image:
    build: .
    image: seaglass-ci:${SEAGLASS_CI_TAG}
    profiles: [build]

networks:
  # Réseau partagé par le runner et ses jobs (config.yaml, container.network) :
  # sans lui, les jobs ne joignent pas le serveur de cache du runner.
  ci:
    name: seaglass-ci
